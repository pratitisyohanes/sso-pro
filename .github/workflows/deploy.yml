# Test and deploy auth-service to the VPS on every push to main
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at the same time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy to VPS
    needs: [backend-test]
    # Pull requests only run tests; deployment happens after merge to main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /var/www/sso
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload backend
        env:
          SSH: ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          # .env and the signing key on the server are kept; node_modules is reinstalled there
          rsync -az --delete -e "$SSH" \
            --exclude node_modules --exclude .env --exclude keys --exclude tests --exclude coverage \
            backend/ "$TARGET:$APP_DIR/backend/"

      - name: Install, migrate, restart and check
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "bash -s" <<'EOF'
          set -e
          cd /var/www/sso/backend
          npm ci --omit=dev --no-audit --no-fund
          npx sequelize-cli db:migrate --env production
          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save
          # auth-service has no public domain, so the health check runs on the server itself
          sleep 3
          curl --fail --silent --show-error --retry 5 --retry-delay 3 http://127.0.0.1:5002/api/v1/health
          EOF
