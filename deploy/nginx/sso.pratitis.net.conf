# Nginx site for KandangID: login pages and OpenID Connect endpoints are public; the server-to-server API is not
# Install: sudo cp sso.pratitis.net.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/sso.pratitis.net.conf /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name sso.pratitis.net;

    client_max_body_size 64k;

    # booking-api reaches these on 127.0.0.1:5002 directly; browsers never need them
    location /oauth/ { return 404; }
    location /api/ { return 404; }

    # Everything else: /, /login, /mfa, /register, /oidc/*, /.well-known/*
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Lets Express see HTTPS so the kid_sid cookie can be Secure (COOKIE_SECURE=true)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
